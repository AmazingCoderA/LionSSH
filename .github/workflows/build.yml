name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libudev-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
      - name: Build CLI
        run: cargo build --release --locked --target ${{ matrix.target }} --bin lionssh --no-default-features
      - name: Build GUI
        run: cargo build --release --locked --target ${{ matrix.target }} --bin lionssh-gui
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lionssh${{ matrix.ext }} dist/
          cp target/${{ matrix.target }}/release/lionssh-gui${{ matrix.ext }} dist/
          cp README.md LICENSE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: lionssh-${{ matrix.target }}
          path: dist/*
