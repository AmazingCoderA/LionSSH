name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            archive: zip
            ext: .exe
            gui: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            archive: tar.gz
            ext: ""
            gui: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            archive: tar.gz
            ext: ""
            gui: false
            musl: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            archive: tar.gz
            ext: ""
            gui: false
            cross: true
          - os: ubuntu-latest
            target: aarch64-linux-android
            platform: android-arm64
            archive: tar.gz
            ext: ""
            gui: false
            cross: true

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: rel-${{ matrix.platform }}

      - name: Linux GUI deps
        if: matrix.gui && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libudev-dev libxkbcommon-dev libwayland-dev libgtk-3-dev

      - name: Musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build CLI
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin lionssh --no-default-features
          else
            cargo build --release --locked --target ${{ matrix.target }} --bin lionssh --no-default-features
          fi

      - name: Build GUI
        if: matrix.gui
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} --bin lionssh-gui

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          NAME="lionssh-${VERSION}-${{ matrix.platform }}"
          OUT="dist/$NAME"
          mkdir -p "$OUT"
          cp "target/${{ matrix.target }}/release/lionssh${{ matrix.ext }}" "$OUT/lionssh-cli-${{ matrix.platform }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/lionssh${{ matrix.ext }}" "dist/lionssh-cli-${{ matrix.platform }}${{ matrix.ext }}"
          if [ "${{ matrix.gui }}" = "true" ]; then
            cp "target/${{ matrix.target }}/release/lionssh-gui${{ matrix.ext }}" "$OUT/lionssh-gui-${{ matrix.platform }}${{ matrix.ext }}"
            cp "target/${{ matrix.target }}/release/lionssh-gui${{ matrix.ext }}" "dist/lionssh-gui-${{ matrix.platform }}${{ matrix.ext }}"
            (cd dist && sha256sum "lionssh-gui-${{ matrix.platform }}${{ matrix.ext }}" > "lionssh-gui-${{ matrix.platform }}${{ matrix.ext }}.sha256")
          fi
          cp README.md LICENSE "$OUT/"
          cp -r packaging "$OUT/packaging"
          (cd dist && sha256sum "lionssh-cli-${{ matrix.platform }}${{ matrix.ext }}" > "lionssh-cli-${{ matrix.platform }}${{ matrix.ext }}.sha256")
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a "$NAME.zip" "$NAME")
          else
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          fi
          (cd dist && sha256sum "$NAME.${{ matrix.archive }}" > "$NAME.${{ matrix.archive }}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: lionssh-${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip *.tar.gz *.exe lionssh-* 2>/dev/null | grep -v '\.sha256' > SHA256SUMS.txt || true
      - uses: softprops/action-gh-release@v2
        with:
          name: LionSSH ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
