[package]
name = "lionssh"
version = "2.1.0"
edition = "2021"
description = "LionSSH - command center for SSH, scripts, proxies, scheduler, aliases"
license = "MIT"
repository = "https://github.com/AmazingCoderA/LionSSH"

[lib]
name = "lionssh"
path = "src/lib.rs"

[[bin]]
name = "lionssh"
path = "src/bin/lionssh.rs"

[[bin]]
name = "lionssh-gui"
path = "src/bin/lionssh_gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
